name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep CI when configured
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "SEMGREP_APP_TOKEN is not configured; Semgrep CI did not run (advisory — this job exits 0)."
            echo "Add the repository secret from Semgrep AppSec Platform to enable semgrep ci."
            echo "Merge gates remain verify, integration, and e2e until the token is set."
            exit 0
          fi
          semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Identity SSOT gate
        run: npm run check:identity-ssot

      - name: Compose DB bind gate
        run: npm run check:compose-db-bind

      - name: Run lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: [verify, integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        run: npm run test:e2e:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/yum4less_dev
          CI: "1"
          GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY }}

  # Downstream of all merge gates — never builds/pushes an image from ungated code.
  # Master-push only (same trigger as the rest of CI). Tag/release-only publishing
  # is a later option if TrueNAS pin ceremony prefers it; SHA tags already pin builds.
  publish-image:
    runs-on: ubuntu-latest
    needs: [verify, integration, e2e, semgrep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/yum4less-app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # SHA tag = deploy/rollback pin.
          # :homelab = mutable float for Watchtower auto-update (same digest as :latest on green master).
          # :latest = convenience only — do not pin TrueNAS rollback to it.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:homelab
          # Bake client analytics into the shopper bundle (NEXT_PUBLIC_* is build-time only).
          # Server still requires YUM4LESS_ENABLE_ANALYTICS=1 (+ optional YUM4LESS_ANALYTICS_SINK).
          build-args: |
            NEXT_PUBLIC_YUM4LESS_ANALYTICS=1
          # Omit org.opencontainers.image.source to avoid an extra public-repo link signal;
          # Actions-published packages from this public repo are still public by inheritance.
          labels: |
            org.opencontainers.image.title=yum4less-app
            org.opencontainers.image.description=Yum4Less shopper app (Next.js standalone)
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report GHCR package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Actions-published packages from a public repo inherit public visibility.
          # GITHUB_TOKEN cannot flip that to private (PUT /visibility → 404). Keeping the
          # job green and reporting truth is required; private would be a manual package
          # admin / unlink change if Sean wants PAT-gated pulls later.
          package_name="yum4less-app"
          encoded_name="$(printf '%s' "${package_name}" | jq -sRr @uri)"
          vis="$(gh api "/user/packages/container/${encoded_name}" --jq .visibility)"
          echo "Package visibility: ${vis}"
          echo "Published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}"
          echo "Also tagged :latest and :homelab (mutable — Watchtower). Pin rollback to the SHA tag."
          if [ "${vis}" = "public" ]; then
            echo "TrueNAS can pull without a GitHub PAT while the package stays public."
          else
            echo "Private package — TrueNAS will need a PAT with read:packages."
          fi

  # Separate ingest image (Playwright + cron) — never bake ingest into yum4less-app.
  publish-ingest-image:
    runs-on: ubuntu-latest
    needs: [verify, integration, e2e, semgrep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/yum4less-ingest" >> "$GITHUB_OUTPUT"

      - name: Use ingest dockerignore
        run: cp .dockerignore.ingest .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ingest
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:homelab
          labels: |
            org.opencontainers.image.title=yum4less-ingest
            org.opencontainers.image.description=Yum4Less scheduled weekly-ad ingest (Node + Playwright + cron)
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report ingest GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="yum4less-ingest"
          encoded_name="$(printf '%s' "${package_name}" | jq -sRr @uri)"
          vis="$(gh api "/user/packages/container/${encoded_name}" --jq .visibility 2>/dev/null || echo "unknown")"
          echo "Package visibility: ${vis}"
          echo "Published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}"
          echo "Also tagged :latest and :homelab (mutable — Watchtower). Pin rollback to the SHA tag."
