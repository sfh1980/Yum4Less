name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep CI when configured
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "SEMGREP_APP_TOKEN is not configured; Semgrep CI did not run (advisory — this job exits 0)."
            echo "Add the repository secret from Semgrep AppSec Platform to enable semgrep ci."
            echo "Merge gates remain verify, integration, and e2e until the token is set."
            exit 0
          fi
          semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Identity SSOT gate
        run: npm run check:identity-ssot

      - name: Compose DB bind gate
        run: npm run check:compose-db-bind

      - name: Run lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: [verify, integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        run: npm run test:e2e:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/yum4less_dev
          CI: "1"
          GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY }}
