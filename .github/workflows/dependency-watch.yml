name: Dependency watch

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (report only)
        run: |
          npm audit --json > audit-report.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          const advisories = Object.values(report.vulnerabilities ?? {});
          const postcss = advisories.filter((entry) =>
            String(entry.via ?? '')
              .includes('GHSA-qx2v-qp2m-jg93') ||
            String(entry.name ?? '').includes('postcss')
          );
          console.log(`npm audit: ${advisories.length} advisories total`);
          if (postcss.length > 0) {
            console.log('::warning::PostCSS advisory GHSA-qx2v-qp2m-jg93 (via Next.js) still present — track via Dependabot; do not npm audit fix --force.');
            for (const entry of postcss) {
              console.log(`- ${entry.name} (${entry.severity}): ${entry.via}`);
            }
          }
          NODE

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          if-no-files-found: ignore
