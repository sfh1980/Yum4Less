services:
  db:
    image: postgres:17
    container_name: yum4less-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yum4less_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Loopback only — never publish Postgres on 0.0.0.0 (Tier 2 SS-1).
      # Enforced by npm run check:compose-db-bind / CI.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yum4less_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
